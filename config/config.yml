# =============================================================================
# MAAS-Road-Scenes Pipeline Configuration
# Paths are resolved relative to the repository root unless absolute.
# =============================================================================
# Pipeline Execution Flags
# =============================================================================
pipeline:
  run_erfnet: false
  run_eomt: true

paths:
  # Override root for Google Colab (ignored when running locally)
  colab_root: "/content/drive/MyDrive/Project"

  datasets:
    cityscapes:             "Datasets/Cityscapes"
    fishyscapes_static:     "Datasets/Fishyscapes/fs_static/images/*.jpg"
    fishyscapes_lost_found: "Datasets/Fishyscapes/FS_LostFound_full/images/*.png"
    road_anomaly:           "Datasets/RoadAnomaly/images/*.jpg"
    road_anomaly21:         "Datasets/SegmentMeIfYouCan/RoadAnomaly21/images/*.png"
    road_obstacle21:        "Datasets/SegmentMeIfYouCan/RoadObsticle21/images/*.webp"

  models:
    trained_models_dir: "checkpoints"
    erfnet_weights:     "checkpoints/erfnet_pretrained.pth"
    erfnet_model:       "third_party/eval/erfnet.py"
    eomt_base_checkpoint: "checkpoints/eomt_cityscapes.bin"
    eomt_checkpoint:    "checkpoints/solutions/20260516_130935/epoch_3_EoMT.pth"

  logits:
    erfnet: "core/evaluation/eval/saved_logits/erfnet"
    eomt:   "core/evaluation/eomt/saved_logits/eomt"

  tables:
    main:        "results/TABLE.md"
    temperature: "results/TABLE_T.md"

  venvs:
    eval_python: "core/evaluation/eval/.venv_eval/bin/python"
    eomt_python: "core/evaluation/eomt/.venv_eomt/bin/python"

# =============================================================================
# Evaluation hyperparameters
# =============================================================================
eval:
  temperatures: [0.5, 0.75, 1.1]
  num_classes: 20
  ignore_index: 19
  save_logits: true

# =============================================================================
# Analysis parameters
# =============================================================================
analysis:
  # Task 1: Semantics
  n_bands: 5
  boundary_kernel_size: 15
  
  # Task 2: Objects
  thresh_small: 1000
  thresh_medium: 5000
  
  # Task 3: Resolution & Attention
  resolutions: [512, 768, 1024]
  patch_size: 14
  num_queries: 100
  
  # Output
  reports_dir: "results/analysis_reports"
  
  # Plotting defaults
  plotting:
    dpi: 150
    figsize: [12, 6]
    font_size: 12
    theme: "dark"

# =============================================================================
# Solutions & Data Augmentation Parameters (Outlier Pasting & OOD Loss)
# =============================================================================
solutions:
  augmentation:
    p_apply: 0.1               # RbA OE setting: sparse pasted outliers preserve closed-set accuracy.
    p_small: 0.85              # Prefer small road obstacles.
    small_scale_range: [0.0005, 0.008] # Small debris, bottles, bags, and similar objects.
    large_scale_range: [0.02, 0.08]    # Avoid overfitting to very large pasted objects.
    perspective_strength: 1.0  # Shrink pasted objects toward the horizon.
    boundary_rate: 0.0         # Place anomalies on road/flat pixels before boundary cases.
    road_rate: 0.9             # Share of non-boundary pastes centered on road pixels.
    road_class_id: 0           # Cityscapes trainId for road.
    # Critical Cityscapes trainIds: building, wall, fence, pole, vegetation, terrain.
    boundary_classes: [2, 3, 4, 5, 8, 9]
    alpha: 1.0                 # Use hard pasting.
    edge_feathering: true      # Soften cutout edges without adding strong artifacts.
    noise_std: 0.0             # Avoid teaching global noise as an OOD shortcut.

  training:
    resume_from: null           # null: fresh run (new timestamped folder) | path: resume from that specific run folder
                                # Accepts relative (to project root) or absolute paths.
                                # Example: "checkpoints/solutions/20260504_014500"
    epochs: 5
    lr: 0.00001
    batch_size: 4
    num_workers: 8
    trainable_scope: "rba_heads" # Options: rba_heads, rba_heads_queries, decoder, all.
    ood_loss_type: "rba_hinge"   # Options: max_entropy, entropy_logit_norm, energy, logit_norm, rba_hinge.
    ood_entropy_weight: 1.0
    ood_logit_norm_weight: 0.01
    rba_margin: 5.0              # Squared hinge margin from the RbA OE setup.
    ood_loss_weight: 0.05
    ood_loss_warmup_epochs: 3
    ce_loss_weight: 2.0          # Raised from 1.0 to reduce mIoU regression.
    results_dir:    "results/solutions"      # Logs and auxiliary outputs.
    checkpoint_dir: "checkpoints/solutions"  # Fine-tuned checkpoints.
